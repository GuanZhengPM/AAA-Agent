name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Test acceptance binding
        run: bun test packages/aaa-app/test/acceptance-binding.test.ts
      - name: Test authentication
        run: bun test packages/aaa-app/test/auth.test.ts
      - name: Test interactive mode
        run: bun test packages/aaa-app/test/interactive.test.ts
      - name: Test transcript durability
        run: bun test packages/aaa-app/test/memory-history.test.ts -t "session transcript"
      - name: Test context budgeting
        run: bun test packages/aaa-app/test/memory-history.test.ts -t "rolling digest|context injection"
      - name: Test provider retry classification
        run: bun test packages/aaa-app/test/memory-history.test.ts -t "retries transient failures"
      - name: Test provider attempt timeout
        run: bun test packages/aaa-app/test/memory-history.test.ts -t "turns a stalled HTTP attempt"
      - name: Test provider retry cancellation
        run: bun test packages/aaa-app/test/memory-history.test.ts -t "aborts promptly"
      - name: Test adaptive runtime
        run: bun test packages/aaa-app/test/runtime.test.ts
      - name: Test session storage
        run: bun test packages/aaa-app/test/session-store.test.ts
      - name: Test goal and ledger control
        run: bun test packages/aaa-runtime/test
      - name: Test workspace tools
        run: bun test packages/aaa-workspace/test/tools.test.ts
